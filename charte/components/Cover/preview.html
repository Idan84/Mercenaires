<!-- @dsCard height=288 -->
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Charte Blood & Wages</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&amp;family=EB+Garamond:wght@500&amp;display=swap">
<style>
  html,body{margin:0;height:100%}
  body{background:var(--parchemin);overflow:hidden}
  .cover{position:relative;width:960px;height:288px;overflow:hidden}
  .band{position:absolute;left:0;top:0;width:960px;height:112px;display:block}
  .bordeaux{fill:var(--bordeaux)}
  .encre{fill:var(--encre)}
  .or{fill:var(--or)}
  .laiton{fill:var(--laiton)}
  .trait{stroke:var(--or);stroke-width:1}
  .etape{stroke:var(--or);stroke-width:1}
  .franchie{fill:var(--laiton)}
  .en-cours{fill:var(--or-clair);stroke:var(--or-clair)}
  .a-venir{fill:var(--encre)}
  .words{position:absolute;left:40px;right:40px;bottom:30px}
  .name{margin:0;font:700 64px/.95 var(--font-titre);letter-spacing:.04em;color:var(--encre);white-space:nowrap}
  .tag{margin:10px 0 0 3px;font:500 14px/20px var(--font-texte);color:var(--encre-secondaire)}
</style>
</head>
<body>
<div class="cover">
<svg class="band" viewBox="0 0 960 112" width="960" height="112" aria-hidden="true">
<!--
  blocks      bordeaux 440×112 (le bouton d'Idan, la couleur qu'on retient) · encre 336×112 · laiton 24×112 · or 160×112 au bord droit — bande pleine largeur, 112 de haut, sur le fond parchemin (≈39 % de 960×288)
  arrangement une bande de blocs inégaux en haut (squelette « top-band » : le nom en Cinzel est trop large pour la zone de 440 px), le nom dessous
  pattern     la ligne des étapes de la charte (« le losange seulement pour les étapes ») : un trait or de 1 px sur bordeaux et encre, 12 losanges de 9 px au pas de 64 px — franchis en laiton, l'étape en cours en or clair, à venir en encre cerclés d'or
  scales      losange 9 px et trait 1 px de .steps (creation-capitaine.css) ; pas 64 px ; coins carrés (la charte n'a pas d'arrondi)
-->
<rect class="bordeaux" x="0" y="0" width="440" height="112"/>
<rect class="encre" x="440" y="0" width="336" height="112"/>
<rect class="laiton" x="776" y="0" width="24" height="112"/>
<rect class="or" x="800" y="0" width="160" height="112"/>
<line class="trait" x1="24" y1="56.5" x2="760" y2="56.5"/>
<g transform="translate(0 56.5)">
  <rect class="etape franchie" x="-4.5" y="-4.5" width="9" height="9" transform="translate(56 0) rotate(45)"/>
  <rect class="etape franchie" x="-4.5" y="-4.5" width="9" height="9" transform="translate(120 0) rotate(45)"/>
  <rect class="etape franchie" x="-4.5" y="-4.5" width="9" height="9" transform="translate(184 0) rotate(45)"/>
  <rect class="etape franchie" x="-4.5" y="-4.5" width="9" height="9" transform="translate(248 0) rotate(45)"/>
  <rect class="etape franchie" x="-4.5" y="-4.5" width="9" height="9" transform="translate(312 0) rotate(45)"/>
  <rect class="etape en-cours" x="-4.5" y="-4.5" width="9" height="9" transform="translate(376 0) rotate(45)"/>
  <rect class="etape a-venir" x="-4.5" y="-4.5" width="9" height="9" transform="translate(440 0) rotate(45)"/>
  <rect class="etape a-venir" x="-4.5" y="-4.5" width="9" height="9" transform="translate(504 0) rotate(45)"/>
  <rect class="etape a-venir" x="-4.5" y="-4.5" width="9" height="9" transform="translate(568 0) rotate(45)"/>
  <rect class="etape a-venir" x="-4.5" y="-4.5" width="9" height="9" transform="translate(632 0) rotate(45)"/>
  <rect class="etape a-venir" x="-4.5" y="-4.5" width="9" height="9" transform="translate(696 0) rotate(45)"/>
  <rect class="etape a-venir" x="-4.5" y="-4.5" width="9" height="9" transform="translate(760 0) rotate(45)"/>
</g>
</svg>
<div class="words">
  <h1 class="name">Charte Blood &amp; Wages</h1>
  <p class="tag">Ce qui est validé pour le jeu, rassemblé en un seul endroit.</p>
</div>
</div>
</body>
</html>
