<!-- @dsCard group="Ornements" height=470 subtitle="Les filets qui s'affinent et entrent dans leur motif, sur la scène et sur le parchemin" -->
<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Filets</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&amp;family=EB+Garamond:ital,wght@0,500;0,600;0,700;1,500&amp;display=swap">
<style>
  body{margin:0;font-family:var(--font-texte)}
  .scene{display:grid;justify-items:center;gap:30px;padding:30px 24px 34px;background:var(--ink)}
  .scene .rule{width:520px}
  .papier{display:grid;justify-items:center;gap:26px;padding:30px 24px 36px;background:var(--parchemin)}
  .papier .parch-head{width:420px}
  .papier .divider{width:420px}
  .papier .fiche-titre{display:flex;align-items:center;justify-content:center;gap:16px;height:1.2em;margin:0;white-space:nowrap;font:700 24px/1.2 var(--font-titre);letter-spacing:.1em;text-transform:uppercase;color:var(--encre)}
  .papier .fiche-titre{width:560px}
</style></head>
<body>
<div class="scene">
  <h1 class="brand">Création du capitaine</h1>
  <div class="rule"><span>3</span></div>
  <p class="message">Le vieux capitaine vous appelait Bob. Corrigeons ça.</p>
</div>
<div class="papier">
  <div class="parch-head">Registre des capitaines</div>
  <div class="divider" aria-hidden="true"><i class="orn" style="--orn:url('{{asset:Ornements de la charte/fleur-de-lys.svg}}')"></i></div>
  <div class="divider" aria-hidden="true"><i class="losange"></i></div>
  <h3 class="fiche-titre">Nains des montagnes</h3>
</div>
</body>
</html>
