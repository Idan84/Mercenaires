}
function layout(ids,links,dist){
 const ranks=new Map();if(!global){for(const id of ids){const d=dist.get(id)||0;if(!ranks.has(d))ranks.set(d,[]);ranks.get(d).push(id)}}
 else{const categories=[...new Set(ids.map(id=>map.get(id).type))];for(const id of ids){const d=categories.indexOf(map.get(id).type);if(!ranks.has(d))ranks.set(d,[]);ranks.get(d).push(id)}}

}
