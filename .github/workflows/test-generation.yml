name: Test mercenary generation

on:
  push:
    branches: [main, test]
  pull_request:

jobs:
  generation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/generation.test.js
      - run: node tests/combat.test.js
