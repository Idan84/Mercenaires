name: Mise en ligne Hostinger

# À chaque mise en ligne sur main : assemble le site (scripts/build-site.sh) et l'envoie par FTP
# sur Hostinger. L'envoi ajoute et remplace des fichiers ; il n'efface que ce qu'il avait lui-même envoyé et qui a quitté
# le site (scripts/deploy-obsolete.sh, Idan, 2026-11-15) : ce qu'Idan
# dépose directement sur Hostinger (médias) n'est jamais touché.
# Seulement ce qui a changé depuis le dernier envoi réussi (Idan, 2026-11-04 ; scripts/deploy-ftp.sh) :
# un manifeste (.deploy-manifest) reste en ligne ; chaque fichier est remplacé sans être effacé d'abord.
# Lancé à la main avec « complet », il renvoie tout le site.
#
# Secrets du dépôt (Settings → Secrets and variables → Actions) :
#   HOSTINGER_FTP_HOST, HOSTINGER_FTP_USER, HOSTINGER_FTP_PASSWORD
# Variables facultatives :
#   HOSTINGER_FTP_DIR  dossier distant (par défaut : le dossier du compte FTP)
#   HOSTINGER_SITE_URL adresse du site (par défaut : https://bloodandwages.idanwizen.com)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      complet:
        description: "Tout renvoyer, sans lire le manifeste (si un fichier a disparu chez Hostinger)"
        type: boolean
        default: false

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_DIR: ${{ vars.HOSTINGER_FTP_DIR || '.' }}
      SITE_URL: ${{ vars.HOSTINGER_SITE_URL || 'https://bloodandwages.idanwizen.com' }}
    steps:
      - name: Vérifier les secrets FTP
        env:
          FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
          FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          missing=""
          [ -n "$FTP_HOST" ] || missing="$missing HOSTINGER_FTP_HOST"
          [ -n "$FTP_USER" ] || missing="$missing HOSTINGER_FTP_USER"
          [ -n "$LFTP_PASSWORD" ] || missing="$missing HOSTINGER_FTP_PASSWORD"
          if [ -n "$missing" ]; then echo "::error::Secrets manquants :$missing"; exit 1; fi

      - uses: actions/checkout@v4

      - name: Assembler le site
        run: bash scripts/build-site.sh site

      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Envoyer sur Hostinger (FTP chiffré, seulement ce qui a changé ; effacer ce qui a quitté le site)
        env:
          FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
          FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          DEPLOY_FULL: ${{ inputs.complet && '1' || '' }}
        run: |
          # Le certificat FTP de Hostinger est générique (*.hstgr.io), pas au nom de l'adresse configurée :
          # on se connecte sous un nom qu'il couvre, associé à l'IP du serveur, et il reste vérifié.
          read -r tls_host tls_ip < <(bash scripts/ftp-tls-host.sh "$FTP_HOST")
          if [ -n "${tls_ip:-}" ]; then echo "$tls_ip $tls_host" | sudo tee -a /etc/hosts >/dev/null; fi
          LFTP_OPEN="open --env-password -u \"$FTP_USER\" \"$tls_host\"" bash scripts/deploy-ftp.sh site "$FTP_DIR"

      - name: Vérifier le site en ligne
        run: |
          for path in / /core/campaign.js /data/index.json; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL$path")
            echo "$code $SITE_URL$path"
            [ "$code" = "200" ] || { echo "::error::$SITE_URL$path répond $code"; exit 1; }
          done
