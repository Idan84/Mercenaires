      - run: node scripts/build-mercenary-profile.js --check
      - run: node tests/magic.test.js
      - run: node tests/mission-spells.test.js
      - run: node tests/stealth.test.js
      - run: node tests/spell-icons.test.js
      - run: node tests/starting-spells.test.js
      - run: node tests/equipment-effects.test.js
      - run: node tests/equipment-deals.test.js
      - run: node tests/deal-ui.test.js
      - run: node tests/history.test.js
      - run: node tests/steward.test.js
      - run: node tests/steward-ui.test.js
      - run: node tests/avatars.test.js
      - run: node tests/creation.test.js
      - run: node tests/avatar-catalog.test.js
      - run: node tests/avatar-demand.test.js
      - run: node --check scripts/build-avatar-demand.js
      - run: php tests/avatar-index.test.php
      - run: php -l prototype-web/api/avatars.php
      - run: php -l prototype-web/api/silhouettes.php
      - run: php -l prototype-web/api/pictos.php
      - run: php -l prototype-web/api/equipment.php
      - run: php -l prototype-web/api/lib/avatar-index.php
      - name: Assemblage du site (numéros de version)
        run: bash scripts/build-site.sh site && grep -q 'src="ui.js?v=' site/index.html
      - run: node --check prototype-web/mission.js
      - run: node --check prototype-web/ui.js
      - run: node --check prototype-web/camp-calendar.js
      - run: node --check prototype-web/tavern-ui.js
      - run: node --check prototype-web/camp-buildings-ui.js
      - run: node --check game-core/recruit-dialogue.js
      - run: node --check prototype-web/picto-ui.js
      - run: node --check prototype-web/equipment-art.js
      - run: node --check prototype-web/item-card-ui.js
      - run: node --check prototype-web/screen-ui.js
      - run: node --check prototype-web/music-ui.js
      - run: node --check prototype-web/intro-ui.js
      - run: node --check prototype-web/save-ui.js
