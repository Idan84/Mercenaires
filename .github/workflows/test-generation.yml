name: Test mercenary generation

on:
  push:
    branches: [main, test]
  pull_request:

jobs:
  generation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/generation.test.js
      - run: node tests/combat.test.js
      - run: node tests/tavern.test.js
      - run: node tests/tavern-home-ui.test.js
      - run: node tests/music-ui.test.js
      - run: node tests/recruit-dialogue.test.js
      - run: node tests/camp-calendar.test.js
      - run: node tests/mission-end.test.js
      - run: node tests/progression.test.js
      - run: node tests/renown.test.js
      - run: node tests/affinity.test.js
      - run: node tests/roster-ui.test.js
      - run: node tests/quartermaster-ui.test.js
      - run: node tests/equipment-silhouettes-ui.test.js
      - run: node tests/stars.test.js
      - run: node tests/names.test.js
      - run: node tests/character-sheet.test.js
      - run: node tests/design-lab-tags.test.js
      - run: node tests/affinity-display.test.js
      - run: node tests/wizard-ui-refinements.test.js
      - run: node tests/design-graph-simulation.test.js
      - run: node tests/design-graph-integrity.test.js
      - run: node tests/biography.test.js
      - run: node tests/pictos.test.js
      - run: node tests/avatars.test.js
      - run: node tests/creation.test.js
      - run: node tests/avatar-catalog.test.js
      - run: node tests/avatar-coverage.test.js
      - run: php tests/avatar-index.test.php
      - run: php -l prototype-web/api/avatars.php
      - run: php -l prototype-web/api/silhouettes.php
      - run: php -l prototype-web/api/pictos.php
      - run: php -l prototype-web/api/equipment.php
      - run: php -l prototype-web/api/lib/avatar-index.php
      - name: Assemblage du site (numéros de version)
        run: bash scripts/build-site.sh site && grep -q 'src="ui.js?v=' site/index.html
      - run: node --check prototype-web/mission.js
      - run: node --check prototype-web/ui.js
      - run: node --check prototype-web/camp-calendar.js
      - run: node --check prototype-web/tavern-ui.js
      - run: node --check game-core/recruit-dialogue.js
      - run: node --check prototype-web/picto-ui.js
      - run: node --check prototype-web/screen-ui.js
      - run: node --check prototype-web/music-ui.js
      - run: node --check prototype-web/intro-ui.js
      - run: node --check prototype-web/save-ui.js
      - run: node --check prototype-web/quartermaster-ui.js
      - run: node --check prototype-web/reference-data.js
      - run: node --check prototype-web/design/design.js
      - run: node --check prototype-web/design/avatars-lab.js
