name: Test mercenary generation

on:
  push:
    branches: [main, test]
  pull_request:

jobs:
  generation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/generation.test.js
      - run: node tests/combat.test.js
      - run: node tests/tavern.test.js
      - run: node tests/tavern-home-ui.test.js
      - run: node tests/music-ui.test.js
      - run: node tests/recruit-dialogue.test.js
      - run: node tests/camp-calendar.test.js
      - run: node tests/mission-end.test.js
      - run: node tests/missions.test.js
      - run: node tests/progression.test.js
      - run: node tests/renown.test.js
      - run: node tests/affinity.test.js
      - run: node tests/roster-ui.test.js
      - run: node tests/quartermaster-ui.test.js
      - run: node tests/day-news-ui.test.js
      - run: node tests/contract-ui.test.js
      - run: node tests/equipment-silhouettes-ui.test.js
      - run: node tests/stars.test.js
      - run: node tests/names.test.js
      - run: node tests/character-sheet.test.js
      - run: node tests/design-lab-tags.test.js
      - run: node tests/asset-coverage.test.js
      - run: node tests/affinity-display.test.js
      - run: node tests/wizard-ui-refinements.test.js
      - run: node tests/design-graph-simulation.test.js
      - run: node tests/design-graph-integrity.test.js
      - run: node tests/biography.test.js
      - run: node tests/pictos.test.js
      - run: node tests/equipment-art.test.js
      - run: node tests/item-card.test.js
      - run: node tests/item-value.test.js
      - run: node tests/camp-buildings.test.js
      - run: node tests/camp-care.test.js
      - run: node tests/medic.test.js
      - run: node tests/helmets.test.js
      - run: node tests/potions.test.js
      - run: node tests/sling.test.js
      - run: node tests/auto-combat.test.js
      - run: node tests/lieutenants.test.js
      - run: node tests/bodyguard.test.js
      - run: node tests/merchants.test.js
      - run: node tests/merchant-ui.test.js
      - run: node tests/spell-manuals.test.js
      - run: node tests/regeneration.test.js
