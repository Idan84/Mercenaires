<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mercenaires — Design Lab</title>
  <link rel="stylesheet" href="./design.css">
</head>
<body>
  <div class="lab-shell">
    <aside class="sidebar">
      <div class="brand">
        <a href="/" class="back">← Prototype</a>
        <p class="eyebrow">Mercenaires</p>
        <h1>Design Lab</h1>
        <p class="muted">Git est la source de vérité.</p>
      </div>

      <div class="switcher" role="tablist">
        <button class="switch active" data-mode="docs">Docs</button>
        <button class="switch" data-mode="tables">Tableaux</button>
        <button class="switch" data-mode="avatars">Avatars</button>
        <button class="switch" data-mode="images" title="Images attendues par le jeu, hors avatars : ce qui manque">Images</button>
        <button class="switch" data-mode="charte" title="La charte graphique : règles, couleurs, styles de texte, ombres, composants">Charte</button>
        <button class="switch" data-mode="bestiary" title="Ennemis par faction et par ligne : caractéristiques, équipement, points de combat">Bestiaire</button>
        <button class="switch" data-mode="missions" title="Types de mission : règles, camps, ordres et leurs variables">Missions</button>
        <button class="switch" data-mode="cultures" title="Par culture : régler les barres du camp, la fiche au survol et la fiche complète sur l'aperçu du jeu">Cultures</button>
        <a class="switch" href="#doc=93-pending-and-parked.md" style="text-decoration:none;display:inline-flex;align-items:center;justify-content:center" title="Ce qui attend une décision, ce qui est reporté, ce qu'il faut surveiller">À décider</a>
        <a class="switch" href="./atelier/" style="text-decoration:none;display:inline-flex;align-items:center;justify-content:center" title="L'atelier des tags : tags, tests et constantes ; le jeu les lit sur Hostinger (media/atelier/)">Atelier des tags ↗</a>
        <a class="switch" href="./graph/" style="text-decoration:none;display:inline-flex;align-items:center;justify-content:center" title="Explorer les influences et dépendances">Graphe d’influences ↗</a>
      </div>

      <input id="nav-search" class="search" type="search" placeholder="Filtrer…">
      <nav id="nav-list" class="nav-list"></nav>
    </aside>

    <main class="content">
      <div class="content-head">
        <div>
          <p id="content-kicker" class="eyebrow">Design</p>
          <h2 id="content-title">Chargement…</h2>
        </div>
        <div id="content-meta" class="meta"></div>
      </div>

      <div id="table-tools" class="table-tools hidden">
        <input id="table-search" class="search" type="search" placeholder="Rechercher dans le tableau…">
        <span id="table-count" class="count"></span>
      </div>

      <section id="viewer" class="viewer">
        <p class="muted">Chargement des référentiels…</p>
      </section>
    </main>
  </div>
  <script src="/core/mercenary-generator.js"></script>
  <script src="/core/biography.js"></script>
  <script src="/core/avatars.js"></script>
  <script src="/core/avatar-catalog.js"></script>
  <script src="/core/avatar-demand.js"></script>
  <script src="/core/asset-coverage.js"></script>
  <script src="/equipment-art.js"></script>
  <script src="/reference-data.js"></script>
  <script src="./avatars-lab.js"></script>
  <script src="./images-lab.js"></script>
  <script src="./charte-lab.js"></script>
  <script src="./bestiary-lab.js"></script>
  <script src="./missions-lab.js"></script>
  <script src="./cultures-lab.js"></script>
  <script src="./design.js"></script>
</body>
</html>
