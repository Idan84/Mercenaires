      - run: node --check game-core/regeneration.js
      - run: node --check prototype-web/day-news-ui.js
      - run: node --check prototype-web/reference-data.js
      - run: node --check prototype-web/design/design.js
      - run: node --check prototype-web/design/avatars-lab.js
      - run: node --check prototype-web/design/images-lab.js
