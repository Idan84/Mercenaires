name: Extract Notion export
# One-shot migration workflow

on:
  push:
    branches:
      - migration/notion-to-git
    paths:
      - "docs/notion/*.zip"
      - ".github/workflows/extract-notion-export.yml"
      - "scripts/migrate_notion_export.py"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4

      - name: Extract Notion archive with UTF-8 filenames
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import shutil

          zips = sorted(Path("docs/notion").glob("*_ExportBlock-*.zip"))
          if not zips:
              raise SystemExit("No Notion export ZIP found")
          out = Path("archive/notion-export")
          if out.exists():
              shutil.rmtree(out)
          out.mkdir(parents=True)
          with ZipFile(zips[0]) as zf:
              zf.extractall(out)

          files = sorted(str(p.relative_to(out)) for p in out.rglob("*") if p.is_file())
          (out / "MANIFEST.txt").write_text(
              "\n".join(files) + f"\n\nFiles: {len(files)}\n",
              encoding="utf-8",
          )
          PY

      - name: Build Git-native docs and data
        shell: bash
        run: python scripts/migrate_notion_export.py

      - name: Commit extracted archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A archive/notion-export docs/design data/reference
          if git diff --cached --quiet; then
            echo "No extracted changes."
            exit 0
          fi
          git commit -m "archive: re-extract Notion export with UTF-8 filenames"
          git push
