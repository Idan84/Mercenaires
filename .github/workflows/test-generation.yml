name: Test mercenary generation

on:
  push:
    branches: [main, test]
  pull_request:

jobs:
  generation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/generation.test.js
      - run: node tests/combat.test.js
      - run: node tests/tavern.test.js
      - run: node tests/mission-end.test.js
      - run: node tests/biography.test.js
      - run: node tests/pictos.test.js
      - run: node tests/avatars.test.js
      - run: node --check prototype-web/mission.js
      - run: node --check prototype-web/ui.js
      - run: node --check prototype-web/tavern-ui.js
      - run: node --check prototype-web/picto-ui.js
      - run: node --check prototype-web/save-ui.js
